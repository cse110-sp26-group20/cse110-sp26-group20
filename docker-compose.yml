services:
  backend:
    build:
      context: .
      dockerfile: source/backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - uploads:/app/source/backend/uploads

  frontend:
    build:
      context: source/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  uploads:
