<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Templates | MemeLab</title>
    <script
      src="https://kit.fontawesome.com/9f8f81d6ad.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="assets/styles/template.css" />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <script src="assets/scripts/template.js" defer></script>
  </head>
  <body>
    <!-- logo + navigation to home screen-->
    <header>
      <a href="index.html" aria-label="MemeLab home">
        <img
          class="memelab-logo"
          src="assets/images/memelab-logo.svg"
          alt="MemeLab logo"
        />
      </a>
      <div class="navbar-buttons">
        <a href="editor.html" class="nav-link">Create</a>
        <a href="export.html" class="nav-link">Export</a>
      </div>
    </header>

    <img
      id="template-hexagon"
      src="assets/images/template-hexagons.svg"
      alt="hexagons"
    />

    <!-- template section-->
    <div class="template-body">
      <h1>Meme Templates</h1>
      <div class="template-section">
        <!-- Templates will be loaded dynamically by template.js -->
      </div>
    </div>
  </body>
</html>
