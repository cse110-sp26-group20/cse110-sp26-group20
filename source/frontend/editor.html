<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MemeLab Editor</title>
    <link rel="stylesheet" href="assets/styles/editor.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script
      src="https://kit.fontawesome.com/9f8f81d6ad.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="site-header">
      <!-- logo + navigation on single row -->
      <div class="header-top">
        <a href="home.html" aria-label="MemeLab home">
          <img
            src="assets/images/memelab_logo.svg"
            alt="MemeLab Logo"
            class="logo-image"
          />
        </a>
        <nav class="header-nav" aria-label="Main navigation">
          <a href="template.html" class="nav-link">Templates</a>
          <a href="export.html" class="nav-link">Export</a>
        </nav>
      </div>
    </header>

    <!-- Mobile subnav row (Templates / Export) — separate from header so each can have its own shadow -->
    <div class="header-subnav">
      <a href="template.html" class="nav-link">&#8592; Templates</a>
      <a href="export.html" class="nav-link">Export &#8594;</a>
    </div>

    <!-- Editor layout -->
    <div class="editor-layout">
      <!-- left tool sidebar for desktop -->
      <aside class="tool-sidebar" aria-label="Editor tools">
        <button
          class="tool-btn"
          data-tool="text"
          type="button"
          aria-pressed="true"
        >
          <i class="fa-solid fa-t"></i>
          <span class="tool-label">Text</span>
        </button>
        <button
          class="tool-btn"
          data-tool="stickers"
          type="button"
          aria-pressed="false"
        >
          <i class="fa-regular fa-image"></i>
          <span class="tool-label">Images</span>
        </button>
        <button
          class="tool-btn"
          data-tool="filters"
          type="button"
          aria-pressed="false"
        >
          <i class="fa-solid fa-sliders"></i>
          <span class="tool-label">Filters</span>
        </button>
        <button
          class="tool-btn"
          data-tool="ai"
          type="button"
          aria-pressed="false"
        >
          <i class="fa-brands fa-openai"></i>
          <span class="tool-label">AI Generation</span>
        </button>
      </aside>

      <!-- Center canvas area -->
      <section class="canvas-area" aria-label="Meme canvas">
        <div class="canvas-wrapper">
          <canvas id="meme-canvas" width="800" height="500">
            Your browser does not support the HTML canvas element.
          </canvas>
        </div>

        <!-- Mobile only: single caption input below canvas -->
        <div class="mobile-caption-bar mobile-only">
          <input
            type="text"
            id="mobile-caption-input"
            class="mobile-caption-input"
            placeholder="Enter message..."
            aria-label="Caption text"
          />
        </div>
      </section>

      <!-- RIGHT CONTROLS PANEL -->
      <aside
        class="controls-panel"
        id="controls-panel"
        aria-label="Text controls"
      >
        <!-- TEXT PANEL -->
        <div class="tool-panel" id="text-panel" role="tabpanel">
          <!-- Desktop: separate Top Text / Bottom Text inputs -->
          <div class="panel-section desktop-only">
            <h2 class="section-title">Caption</h2>

            <div class="caption-editor">
              <label for="top-text">Top Text</label>
              <input
                type="text"
                id="top-text"
                class="text-input"
                placeholder="Enter message..."
                aria-label="Top caption text"
              />
            </div>

            <div class="caption-editor">
              <label for="bottom-text">Bottom Text</label>
              <input
                type="text"
                id="bottom-text"
                class="text-input"
                placeholder="Enter message..."
                aria-label="Bottom caption text"
              />
            </div>
          </div>

          <!-- Mobile: Text section header + size slider -->
          <div class="panel-section mobile-only">
            <h2 class="section-title">Text</h2>
            <div class="size-row">
              <label for="font-size-slider">Size</label>
              <input
                type="range"
                id="font-size-slider"
                class="size-slider"
                min="10"
                max="200"
                value="80"
                aria-label="Font size"
              />
            </div>
          </div>

          <!-- FONT SECTION -->
          <div class="panel-section">
            <h2 class="section-title desktop-only">Font</h2>

            <!-- Desktop: dropdown controls -->
            <div class="desktop-only">
              <select
                id="font-family"
                class="select-input"
                aria-label="Font family"
              >
                <option value="Times New Roman">Times New Roman</option>
                <option value="Impact">Impact</option>
                <option value="Arial">Arial</option>
                <option value="Comic Sans MS">Comic Sans MS</option>
                <option value="Georgia">Georgia</option>
                <option value="Helvetica">Helvetica</option>
                <option value="Verdana">Verdana</option>
              </select>

              <div class="font-detail-row">
                <select
                  id="font-weight"
                  class="select-input"
                  aria-label="Font style"
                >
                  <option value="bold">Bold</option>
                  <option value="normal">Normal</option>
                  <option value="italic">Italic</option>
                  <option value="bold italic">Bold Italic</option>
                </select>

                <div class="font-size-group">
                  <input
                    type="number"
                    id="font-size"
                    class="font-size-input"
                    value="140"
                    min="10"
                    max="300"
                    aria-label="Font size in pixels"
                  />
                  <span class="unit-label">px</span>
                </div>
              </div>
            </div>

            <!-- Mobile: preset font buttons -->
            <div class="mobile-only">
              <div class="font-btn-row">
                <label>Font</label>
                <div class="font-btn-group">
                  <button class="font-btn" type="button">Impact</button>
                  <button class="font-btn" type="button">Arial</button>
                  <button class="font-btn" type="button">Comic</button>
                  <button class="font-btn" type="button">Times NR</button>
                </div>
              </div>
            </div>
          </div>

          <!-- COLOR SECTION -->
          <div class="panel-section">
            <h2 class="section-title">Color</h2>

            <!-- Desktop: hex + opacity display row -->
            <div class="color-display-row">
              <label
                class="color-preview"
                id="color-preview"
                for="color-picker-desktop"
                style="background-color: #000000"
                aria-label="Current color preview"
              >
                <input
                  type="color"
                  id="color-picker-desktop"
                  class="color-picker-hidden"
                  value="#000000"
                />
              </label>
              <input
                type="text"
                id="color-hex"
                class="hex-input"
                value="000000"
                maxlength="6"
                aria-label="Hex color value"
              />
              <span style="color: var(--lab-muted)">|</span>
              <input
                type="number"
                id="opacity-input"
                class="opacity-input"
                value="100"
                min="0"
                max="100"
                aria-label="Opacity percentage"
              />
              <span class="opacity-pct">%</span>
            </div>

            <!-- Color buttons (both) -->
            <div class="color-btn-group" aria-label="Color presets">
              <label
                class="color-btn color-btn--rainbow mobile-only"
                aria-label="Custom color"
                title="Pick a custom color"
              >
                <img src="assets/images/rainbow-beaker.svg" alt="" />
                <input
                  type="color"
                  id="color-picker-input"
                  class="color-picker-hidden"
                  value="#000000"
                  aria-label="Color picker"
                />
              </label>

              <button
                class="color-btn"
                data-color="#e03535"
                type="button"
                aria-label="Red"
              >
                <img src="assets/images/red-beaker.svg" alt="" />
              </button>
              <button
                class="color-btn"
                data-color="#e07820"
                type="button"
                aria-label="Orange"
              >
                <img src="assets/images/orange-beaker.svg" alt="" />
              </button>
              <button
                class="color-btn"
                data-color="#d4c020"
                type="button"
                aria-label="Yellow"
              >
                <img src="assets/images/yellow-beaker.svg" alt="" />
              </button>
              <button
                class="color-btn"
                data-color="#1aaa55"
                type="button"
                aria-label="Green"
              >
                <img src="assets/images/green-beaker.svg" alt="" />
              </button>
              <button
                class="color-btn"
                data-color="#3355cc"
                type="button"
                aria-label="Blue"
              >
                <img src="assets/images/blue-beaker.svg" alt="" />
              </button>
              <button
                class="color-btn"
                data-color="#7733cc"
                type="button"
                aria-label="Purple"
              >
                <img src="assets/images/purple-beaker.svg" alt="" />
              </button>
            </div>
          </div>
        </div>

        <!-- FILTERS PANEL -->
        <div class="tool-panel active" id="filters-panel" role="tabpanel">
          <div class="filter" id="filter-1">
            <img
              src="assets/images/baby-meme.jpg"
              alt="image of a baby holding his fist up"
            />
            <p>Normal</p>
          </div>
          <div class="filter" id="filter-2">
            <img
              src="assets/images/baby-meme.jpg"
              alt="image of a baby holding his fist up"
            />
            <p>Black & White</p>
          </div>
          <div class="filter" id="filter-3">
            <img
              src="assets/images/baby-meme.jpg"
              alt="image of a baby holding his fist up"
            />
            <p>Distorted</p>
          </div>
          <div class="filter" id="filter-4">
            <img
              src="assets/images/baby-meme.jpg"
              alt="image of a baby holding his fist up"
            />
            <p>Toaster</p>
          </div>
          <div class="filter" id="filter-5">
            <img
              src="assets/images/baby-meme.jpg"
              alt="image of a baby holding his fist up"
            />
            <p>Low-Resolution</p>
          </div>
          <div class="filter" id="filter-6">
            <img
              src="assets/images/baby-meme.jpg"
              alt="image of a baby holding his fist up"
            />
            <p>Glitch</p>
          </div>
        </div>

        <img
          src="assets/images/template-hexagons.svg"
          class="hexagon-decor"
          alt=""
        />
      </aside>
    </div>

    <!-- ===== MOBILE BOTTOM TAB BAR ===== -->
    <nav class="mobile-tab-bar" aria-label="Editor tool tabs" role="tablist">
      <button
        class="tab-btn"
        type="button"
        role="tab"
        aria-controls="text-panel"
      >
        <i class="fa-solid fa-t"></i>
        <span class="tab-label">Text</span>
      </button>
      <button
        class="tab-btn"
        type="button"
        role="tab"
        aria-controls="stickers-panel"
      >
        <i class="fa-regular fa-image"></i>
        <span class="tab-label">Images</span>
      </button>
      <button
        class="tab-btn"
        type="button"
        role="tab"
        aria-controls="filters-panel"
      >
        <i class="fa-solid fa-sliders"></i>
        <span class="tab-label">Filters</span>
      </button>
      <button class="tab-btn" type="button" role="tab" aria-controls="ai-panel">
        <i class="fa-brands fa-openai"></i>
        <span class="tab-label">AI Generation</span>
      </button>
    </nav>
  </body>
</html>
