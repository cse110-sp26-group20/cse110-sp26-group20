<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="assets/styles/export.css" />
    <script
      src="https://kit.fontawesome.com/9f8f81d6ad.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <header class="export-header">
      <!-- logo + navigation on single row -->
      <div class="header-top">
        <a href="index.html" aria-label="MemeLab home">
          <img
            src="assets/images/memelab-logo.svg"
            alt="MemeLab Logo"
            class="logo-image"
          />
        </a>
        <nav class="header-nav" aria-label="Main navigation">
          <a href="index.html" class="nav-link">Home</a>
        </nav>
      </div>
    </header>

    <main class="export-page">
      <section class="export-caption">
        <h1 class="page-title">Lab-tested: Meme Approved!</h1>
      </section>

      <section class="preview-section">
        <div class="preview-container">
          <img id="meme-img" alt="Generated Meme Preview" />
        </div>
      </section>

      <section class="export-actions">
        <button class="download-btn" id="download-btn">
          <i class="fa-solid fa-download"></i>
          <span>Download</span>
        </button>

        <button class="share-btn" id="share-btn">
          <i class="fa-solid fa-share-nodes"></i>
          <span>Share</span>
        </button>

        <a href="editor.html" class="back-btn" id="back-btn">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Keep Editing</span>
        </a>
      </section>
      <div id="export-status" class="export-status" aria-live="polite"></div>
    </main>

    <!-- Share Modal -->
    <div id="share-modal" class="share-modal hidden">
      <div class="share-modal-content">
        <h2>Share Meme</h2>

        <p>Your browser doesn't support direct file sharing.</p>

        <div class="share-options">
          <button id="download-fallback-btn" class="share-option">
            <i class="fa-solid fa-download"></i>
            Download Image
          </button>

          <button id="open-image-btn" class="share-option">
            <i class="fa-solid fa-up-right-from-square"></i>
            Open Image
          </button>

          <button id="copy-image-url-btn" class="share-option">
            <i class="fa-solid fa-link"></i>
            Copy Image URL
          </button>
        </div>

        <button id="close-modal-btn" class="close-modal-btn">Close</button>
      </div>
    </div>

    <script src="assets/scripts/export.js" type="module" defer></script>
  </body>
</html>
