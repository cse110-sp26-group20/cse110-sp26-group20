server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # proxy all /api/* requests to the backend container
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # proxy static uploads served by the backend
    location /static/ {
        proxy_pass http://backend:3000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # deny dot-files (.vscode, .DS_Store, etc.)
    location ~ /\. { return 404; }

    # deny dev/build artifacts that should never be served
    location ~* ^/(Dockerfile|\.dockerignore|eslint\.config\.js|package(-lock)?\.json|nginx\.conf)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
